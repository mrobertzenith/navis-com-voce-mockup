name: CI

# Gate obrigatório antes de qualquer coisa chegar em produção. Até este workflow
# existir, nada impedia um push quebrado de ir direto para o Vercel — ver
# ESTRATEGIA_QA.md, seção 1.1.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificacao:
    name: Verificação (tipos, testes, lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificação de tipos (tsc)
        run: npx tsc -b

      - name: Testes unitários (vitest)
        run: npx vitest run

      - name: Qualidade de código (eslint)
        run: npm run lint

      - name: Build de produção
        run: npm run build

      - name: Instalar navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes E2E (Playwright, modo mock — sem segredo nenhum)
        # inclui os @visual: as referências em e2e/**/*-snapshots têm uma
        # cópia gerada no próprio runner Linux do GitHub Actions (sufixo
        # -linux, via .github/workflows/gerar-snapshots-visuais.yml), além
        # da cópia -darwin usada em desenvolvimento local no Mac — o
        # Playwright escolhe a certa pela plataforma sozinho.
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  fluxos-banco-real:
    name: Fluxos contra o banco real (produção — dados marcados e autolimpos)
    runs-on: ubuntu-latest
    # só em push (nunca em pull_request): estes dois scripts escrevem e apagam
    # dados de verdade no Supabase de produção com uma conta admin real — não
    # devem rodar contra código de PR ainda não revisado. Ver ESTRATEGIA_QA.md
    # §2 camada 5 e §5.3/§5.4 pra contexto de por que essas suítes existem.
    if: github.event_name == 'push'
    needs: verificacao
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_SENHA: ${{ secrets.ADMIN_SENHA }}
      TESTE_FLUXO_CORRETOR_B_EMAIL: ${{ secrets.TESTE_FLUXO_CORRETOR_B_EMAIL }}
      TESTE_FLUXO_CORRETOR_B_SENHA: ${{ secrets.TESTE_FLUXO_CORRETOR_B_SENHA }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Fluxo de fumaça (uma sessão, CRUD real, autolimpo)
        run: npm run test:fluxos

      - name: Fluxo cross-corretor (duas sessões reais simultâneas, autolimpo)
        run: npm run test:fluxos-cross
