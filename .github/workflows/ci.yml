name: CI

# Gate obrigatório antes de qualquer coisa chegar em produção. Até este workflow
# existir, nada impedia um push quebrado de ir direto para o Vercel — ver
# ESTRATEGIA_QA.md, seção 1.1.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificacao:
    name: Verificação (tipos, testes, lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificação de tipos (tsc)
        run: npx tsc -b

      - name: Testes unitários (vitest)
        run: npx vitest run

      - name: Qualidade de código (eslint)
        run: npm run lint

      - name: Build de produção
        run: npm run build

      - name: Instalar navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes E2E funcionais (Playwright, modo mock — sem segredo nenhum)
        # @visual fica de fora aqui de propósito: os PNGs de referência em
        # e2e/**/*-snapshots foram gerados no macOS local, e o runner do
        # GitHub Actions é Linux — a comparação de pixels falharia por
        # plataforma diferente, não por regressão de verdade. Rodar os
        # testes visuais em CI exige gerar as referências a partir do
        # próprio runner (ou de um container Linux equivalente) primeiro;
        # ver ESTRATEGIA_QA.md §5.4. Localmente, rode `npm run test:e2e`
        # (sem --grep-invert) pra cobrir os visuais também.
        run: npx playwright test --grep-invert "@visual"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
